# SonarQube Project Configuration for Offline Fitness
# React Native/Expo TypeScript Project

# Project identification
# Note: must match the real SonarCloud project key. The local scanner script
# and CI pass -D overrides, but a stale key here misdirects any bare run.
sonar.organization=brunoo
sonar.projectKey=BrunoO_offline-fitness
sonar.projectName=Offline Fitness
sonar.projectVersion=1.2.0

# Analysis scope: SonarCloud's current scope UX analyzes the whole project and
# IGNORES sonar.sources/sonar.tests/sonar.inclusions/sonar.language (verified by
# CI warning "configured but have no effect"). Restrict scope ONLY via
# sonar.exclusions below; do not reintroduce the ignored keys.

# Source encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/android/**,**/ios/**,**/build/**,**/coverage/**,**/*.d.ts,**/__mocks__/**,**/assets/**,**/python-app/**,**/scripts/**,**/*.config.{js,cjs,mjs},**/babel.config.cjs,**/jest.setup.js,**/increment-version.cjs,**/publish-apk.cjs,**/check-duplicate-imports.js,**/*.spec.ts,**/*.test.ts

# Coverage reports (produced by `npx jest --coverage`; run it before scanning
# to feed these). The test-execution report is deliberately NOT declared:
# nothing in this repo emits Sonar's generic test-execution XML format, and a
# declared path that fails to parse aborts the whole scan.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript configuration
sonar.typescript.tsconfigPath=tsconfig.json

# JavaScript/TypeScript specific settings
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Code duplication
sonar.cpd.exclusions=**/*.spec.ts,**/__tests__/**,**/__mocks__/**

# Issue exclusions (if needed)
# sonar.issue.ignore.multicriteria=e1,e2
# sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1068
# sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.ts
