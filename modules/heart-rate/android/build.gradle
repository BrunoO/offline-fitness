plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.gpslib.heartrate'
version = '0.1.0'

android {
  namespace "com.gpslib.heartrate"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
