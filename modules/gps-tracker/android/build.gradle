plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.gpslib.tracker'
version = '0.1.0'

android {
  namespace "com.gpslib.tracker"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // The fused location provider, ported from the legacy library.
  implementation 'com.google.android.gms:play-services-location:21.3.0'
}
